<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6e6"><title>校团委组织部｜素质拓展活动邀请函</title><link rel="preload" href="page1.jpg" as="image"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff8e9;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}#slides{position:fixed;inset:0;will-change:transform;transition:transform .6s cubic-bezier(.22,.82,.21,1)}.slide{width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}.slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.buttons{position:fixed;z-index:20;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px}.buttons button{border:1px solid #e4c991;background:#fff9e9eb;color:#68461f;border-radius:30px;padding:9px 12px;font-size:13px;box-shadow:0 2px 9px #6f5f5030}.dots{position:fixed;z-index:20;right:9px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px}.dots button{border:0;background:#77947e80;width:8px;height:8px;border-radius:12px;padding:0}.dots button.active{height:19px;background:#e88c2e}.leaf-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.leaf{position:absolute;top:-12vh;animation:fall var(--duration) linear infinite;animation-delay:var(--delay);opacity:.65}@keyframes fall{from{transform:translate3d(0,-14vh,0) rotate(0)}to{transform:translate3d(var(--drift),120vh,0) rotate(420deg)}}#tip{display:none;position:fixed;left:50%;top:65px;transform:translateX(-50%);z-index:25;max-width:90%;padding:8px 12px;border-radius:15px;background:#fff9edee;color:#5b482f;text-align:center;font-size:12px}#tip.show{display:block}@media(prefers-reduced-motion:reduce){.leaf{display:none}#slides{transition:none}}
</style></head><body><main id="slides">
<section class="slide"><img src="page1.jpg" alt="动漫封面" fetchpriority="high" decoding="async"></section>
<section class="slide"><img data-src="page2.jpg" alt="诚挚邀请" decoding="async"></section>
<section class="slide"><img data-src="page3.jpg" alt="关于我们" decoding="async"></section>
<section class="slide"><img data-src="page4.jpg" alt="精彩瞬间" decoding="async"></section>
<section class="slide"><img data-src="page5.jpg" alt="活动预告" decoding="async"></section>
<section class="slide"><img data-src="page6.jpg" alt="期待相见" decoding="async"></section>
</main><div class="leaf-layer" id="leaves"></div><div class="buttons"><button type="button" id="sound">♫ 音乐</button><button type="button" id="home">⌂ 首页</button></div><div class="dots" id="dots"></div><div id="tip">微信可能禁止自动播放，轻触页面即可尝试开启音乐</div><audio id="bgm" src="music.mp3" loop preload="none"></audio>
<script>
(()=>{'use strict';const imgs=[...document.querySelectorAll('.slide img')],slides=document.getElementById('slides'),audio=document.getElementById('bgm'),sound=document.getElementById('sound'),dots=document.getElementById('dots'),tip=document.getElementById('tip');let index=0,locked=false,y=0,x=0,t=0,manuallyPaused=false;function load(i){if(imgs[i]&&imgs[i].dataset.src){imgs[i].src=imgs[i].dataset.src;delete imgs[i].dataset.src}}function go(n){index=Math.min(5,Math.max(0,n));load(index);load(index+1);slides.style.transform=`translate3d(0,-${index*100}dvh,0)`;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===index))}function step(d){if(locked)return;locked=true;go(index+d);setTimeout(()=>locked=false,650)}for(let i=0;i<6;i++){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','第'+(i+1)+'页');b.onclick=()=>go(i);dots.append(b)}go(0);
function soundLabel(){sound.textContent=audio.paused?'♫ 播放音乐':'♫ 暂停音乐'}async function play(){if(manuallyPaused||!audio.paused)return;try{await audio.play();tip.classList.remove('show')}catch(_){tip.classList.add('show')}soundLabel()}function gesture(){if(!manuallyPaused&&audio.paused)play()}sound.onclick=async()=>{if(audio.paused){manuallyPaused=false;await play()}else{manuallyPaused=true;audio.pause();tip.classList.remove('show')}soundLabel()};document.getElementById('home').onclick=()=>go(0);
window.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>20)step(e.deltaY>0?1:-1)},{passive:true});window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}gesture()});window.addEventListener('touchstart',e=>{y=e.touches[0].clientY;x=e.touches[0].clientX;t=Date.now();gesture()},{passive:true});window.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-y,dx=e.changedTouches[0].clientX-x;if(Math.abs(dy)>45&&Math.abs(dy)>Math.abs(dx)&&Date.now()-t<1500)step(dy<0?1:-1)},{passive:true});window.addEventListener('pointerdown',gesture,{passive:true});
const layer=document.getElementById('leaves');for(let i=0;i<7;i++){let s=document.createElement('span');s.className='leaf';s.textContent=i%2?'🍂':'🍁';s.style.left=(i*29%97)+'%';s.style.setProperty('--duration',(15+i*3)+'s');s.style.setProperty('--delay',(-i*3)+'s');s.style.setProperty('--drift',((i%2?1:-1)*(35+i*10))+'px');s.style.fontSize=(13+i%3*3)+'px';layer.append(s)}audio.addEventListener('play',soundLabel);audio.addEventListener('pause',soundLabel);soundLabel();play();})();
</script></body></html>
